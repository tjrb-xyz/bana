name: test
# bana's own tests, on GitHub's runners (bana should not need itself to be
# tested). macOS: its stock bash 3.2 and BSD tools, where bana has to work.
# macOS minutes cost 10x on a private repo: its jobs are few and short.
on:
  push:
  pull_request:
  # By hand (Actions, test, Run workflow): release-selftest only.
  workflow_dispatch:
permissions:
  contents: read
env:
  # act, pinned: its release tarballs and their sha256 (checksums.txt of the release).
  ACT_VERSION: 0.2.89
  ACT_SHA256_LINUX_X86_64: 0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0
  ACT_SHA256_DARWIN_ARM64: 48ae218af96725f7635a66de2b87e1e346893b02add0f16b92f560296b2151fc
jobs:
  scripts:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -x bin/bana lib/*.sh install.sh tests/*.sh tests/stand-ins/* tests/fixtures/runner/*.sh examples/example/*.sh
      - name: tests (macOS's /bin/bash 3.2 and awk)
        if: runner.os == 'macOS'
        run: BASH_UNDER_TEST=/bin/bash tests/run.sh
      - name: "tests (as root, so a Proxmox container's path too)"
        if: runner.os == 'Linux'
        run: sudo -E env PATH="$PATH" tests/run.sh
      - name: the compiled installer (dash and bash; install.ps1 on pwsh)
        if: runner.os == 'Linux'
        run: SH=dash tests/install.sh && SH=bash tests/install.sh && SH=dash tests/install-real.sh && tests/install-ps1.sh
      # The Mac's own: BSD tar, /sbin/sha256sum, sysctl (and Rosetta, when the runner has
      # it), and a quarantined download installed with --from, which leaves no mark behind.
      - name: the compiled installer on the Mac's own tools (/bin/sh)
        if: runner.os == 'macOS'
        run: SH=/bin/sh tests/install.sh && SH=/bin/sh tests/install-real.sh
  manager:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The daemon end to end: real act and Docker, pushes to a local origin, statuses
  # through the gh stand-in, a cancel from the API, kill -9 and a restart, the fix
  # loop with the test as Claude Code (bana's MCP server over stdio), and a second
  # project: one build at a time, bana pause and resume, bana remove.
  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: act ${{ env.ACT_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/act"
          curl -fsSL -o "$RUNNER_TEMP/act.tar.gz" "https://github.com/nektos/act/releases/download/v$ACT_VERSION/act_Linux_x86_64.tar.gz"
          echo "$ACT_SHA256_LINUX_X86_64  $RUNNER_TEMP/act.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/act.tar.gz" -C "$RUNNER_TEMP/act" act
          "$RUNNER_TEMP/act/act" --version
      - name: tests/e2e-daemon.sh
        run: BANA_E2E=1 BANA_E2E_ACT="$RUNNER_TEMP/act/act" tests/e2e-daemon.sh

  # On a Mac: the manager with its menu bar compiled, a real LaunchAgent install, and
  # the daemon end to end with host jobs only (no Docker on GitHub's Macs). One job,
  # so one build of the manager.
  macos-daemon:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: cargo clippy (with the tray)
        working-directory: manager
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test (with the tray)
        if: ${{ !cancelled() }}
        working-directory: manager
        run: cargo test --locked
      - name: cargo build
        if: ${{ !cancelled() }}
        working-directory: manager
        run: cargo build --locked && echo "BANA_DAEMON_BIN=$PWD/target/debug/bana-manager" >>"$GITHUB_ENV"
      - name: bana daemon install, as a LaunchAgent, in a temporary home; then bana add
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bana=$PWD/bin/bana
          T=$(cd "$(mktemp -d)" && pwd -P)
          # A temporary home (launchd gives the daemon the real HOME: BANA_HOME says
          # where bana's home is); GitHub is a local bare repository.
          export HOME=$T/home BANA_HOME=$T/home/.bana FAKE_LOG=$T/log FAKE_STATE=$T/state
          mkdir -p "$HOME" "$FAKE_STATE" "$T/bin"
          git init -q --bare -b main "$T/origin.git"
          printf '[user]\n  name = ci\n  email = ci@example.com\n[url "file://%s"]\n  insteadOf = https://github.com/acme/wid.git\n' "$T/origin.git" >"$HOME/.gitconfig"
          ln -s "$PWD/tests/stand-ins/gh" "$T/bin/gh"
          ln -s "$PWD/tests/stand-ins/act" "$T/bin/act"
          # shellcheck disable=SC2016 # the stub's own $1
          printf '#!/bin/sh\ncase $1 in info) exit 0 ;; esac\n' >"$T/bin/docker"
          chmod +x "$T/bin/docker"
          export PATH=$T/bin:$PATH
          mkdir -p "$T/work/.github/workflows"
          cd "$T/work"
          git init -q -b main .
          git remote add origin https://github.com/acme/wid.git
          printf 'repo = acme/wid\nprefix = wid\n' >.github/bana.conf
          printf 'on:\n  workflow_dispatch:\njobs:\n  a:\n    runs-on: [self-hosted, wid-macos]\n    steps:\n      - run: "true"\n' >.github/workflows/ci.yml
          git add -A && git commit -q -m one && git push -q origin HEAD:main

          # Once a machine, anywhere: the one daemon, with no project yet.
          (cd "$T" && bash "$bana" daemon install --no-tray --no-open)
          plist=$HOME/Library/LaunchAgents/xyz.tjrb.bana.plist
          plutil -lint "$plist"
          launchctl print "gui/$(id -u)/xyz.tjrb.bana" | tee "$T/print" | head -n 40
          grep -q 'state = running' "$T/print"
          # Then the project, in its checkout: the daemon starts it without a restart.
          bash "$bana" add </dev/null
          curl -fsS --noproxy '*' http://127.0.0.1:8470/ci/v1/health | tee "$T/health"
          echo
          grep -q '"global":true' "$T/health"
          grep -q '"projects":\["wid"\]' "$T/health"
          bash "$bana" list | tee "$T/list"
          grep -q '^wid  *acme/wid  *active' "$T/list"
          bash "$bana" daemon status
          bash "$bana" daemon uninstall --purge
          if launchctl print "gui/$(id -u)/xyz.tjrb.bana" >/dev/null 2>&1; then
            echo "still loaded after uninstall" >&2
            exit 1
          fi
          test ! -e "$plist"
          test ! -e "$HOME/.bana/wid/daemon"
      - name: act ${{ env.ACT_VERSION }}
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/act"
          curl -fsSL -o "$RUNNER_TEMP/act.tar.gz" "https://github.com/nektos/act/releases/download/v$ACT_VERSION/act_Darwin_arm64.tar.gz"
          echo "$ACT_SHA256_DARWIN_ARM64  $RUNNER_TEMP/act.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/act.tar.gz" -C "$RUNNER_TEMP/act" act
          "$RUNNER_TEMP/act/act" --version
      - name: tests/e2e-daemon.sh, host jobs only (the ps -Eww marker sweep, caffeinate)
        if: ${{ !cancelled() }}
        run: BANA_E2E=1 BANA_E2E_DOCKER=0 BANA_E2E_ACT="$RUNNER_TEMP/act/act" tests/e2e-daemon.sh

  # Does GitHub take a status whose target_url is a loopback link (the daemon's page)?
  # The daemon's own poster posts to this commit, with one and then without, and reads
  # both back. Not on pull requests from forks: their token cannot write statuses.
  status-selftest:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo build
        working-directory: manager
        run: cargo build --locked
      - name: post-status, with a loopback target_url, then without
        run: |
          set -euo pipefail
          bin=manager/target/debug/bana-manager
          post() { "$bin" post-status --repo "$GITHUB_REPOSITORY" --sha "$SHA" --context bana-selftest "$@"; }
          back() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
              --jq '.statuses[] | select(.context == "bana-selftest") | "\(.state) \(.target_url // "none")"'
          }
          url="http://127.0.0.1:8470/#build=1&job=selftest"
          if post --state pending --description "bana's self-test: a loopback link" --target-url "$url" 2>"$RUNNER_TEMP/err"; then
            got=$(back)
            echo "read back: $got"
            if [ "$got" = "pending $url" ]; then verdict="GitHub accepts a loopback target_url"
            else verdict="GitHub took the status, but its target_url reads back as: $got"; fi
          else
            cat "$RUNNER_TEMP/err"
            grep -q target_url "$RUNNER_TEMP/err" || exit 1
            verdict="GitHub refuses a loopback target_url: $(cat "$RUNNER_TEMP/err")"
          fi
          echo "$verdict"
          echo "$verdict" >>"$GITHUB_STEP_SUMMARY"
          post --state success --description "bana's self-test: no link"
          got=$(back)
          echo "read back: $got"
          test "$got" = "success none"

  # What bana's publish relies on, against the real GitHub, which bana's tests cannot
  # reach: a draft release found by its tag, an asset named with ~ and + read back with
  # its name and digest, generate-notes with previous_tag_name, and deleting the draft
  # leaves no tag. By hand only: it writes a draft on this repository, then deletes it.
  release-selftest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: bana-selftest-${{ github.run_id }}
    steps:
      - name: a draft release, read back, generate-notes, deleted
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          say() { echo "$*"; echo "- $*" >>"$GITHUB_STEP_SUMMARY"; }
          gh --version | head -1
          gh release create --help | grep -q -- --verify-tag
          gh release create --help | grep -q -- '--latest'
          gh release list -R "$R" --exclude-drafts -L 100 --json tagName,isPrerelease >/dev/null
          asset='a_0.1~rc1+g1.deb'
          printf 'bana self-test\n' >"$RUNNER_TEMP/$asset"
          want=sha256:$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)
          trap 'gh release delete "$TAG" -R "$R" --yes >/dev/null 2>&1 || true' EXIT
          (cd "$RUNNER_TEMP" && gh release create "$TAG" -R "$R" --draft --target "$GITHUB_SHA" \
            --title "bana self-test" --notes "bana's self-test: deleted at once" "$asset")
          view=$(gh release view "$TAG" -R "$R" --json isDraft,url,assets)
          echo "$view"
          test "$(jq -r .isDraft <<<"$view")" = true
          say "gh release view finds a draft by its tag"
          say "an asset uploaded as $asset reads back as $(jq -r '.assets[0].name' <<<"$view")"
          got=$(jq -r '.assets[0].digest // "none"' <<<"$view")
          test "$got" = "$want" || { say "its digest reads back as $got, not $want"; exit 1; }
          say "its digest reads back as the file's sha256"
          prev=$(gh api "repos/$R/tags" --jq '.[0].name // ""')
          args=(-f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA")
          [ -z "$prev" ] || args+=(-f "previous_tag_name=$prev")
          notes=$(gh api -X POST "repos/$R/releases/generate-notes" "${args[@]}")
          jq -e '.name and .body' <<<"$notes" >/dev/null
          say "generate-notes answers (previous_tag_name: ${prev:-none}): $(jq -r '.body' <<<"$notes" | tail -1)"
          gh release delete "$TAG" -R "$R" --yes
          if gh api "repos/$R/git/ref/tags/$TAG" >/dev/null 2>&1; then say "deleting the draft left the tag $TAG"; exit 1; fi
          say "deleting the draft leaves no tag"
