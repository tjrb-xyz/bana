[package]
name = "bana-manager"
version = "0.1.0"
description = "bana's dev manager: a loopback web page that shows the runner pool, this machine's runner processes and USB audio devices, and the runs, and joins, leaves and starts them."
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/tjrb-xyz/bana"
rust-version = "1.85"
publish = false

[[bin]]
name = "bana-manager"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
