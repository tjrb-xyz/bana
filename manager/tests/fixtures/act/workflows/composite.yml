name: ci
on:
  workflow_dispatch:
    inputs:
      tier: {type: string, default: quick}
jobs:
  rust:
    name: Rust tests
    runs-on: [self-hosted, wid-macos]
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: ./.github/actions/plan
      - name: flaky
        continue-on-error: true
        run: exit 2
      - name: test
        run: echo ok
