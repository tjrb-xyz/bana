name: ci2
on: workflow_dispatch
jobs:
  matrix:
    strategy:
      matrix:
        target: [x64]
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out && echo "second run x64" > out/app-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: out/
  failsum:
    runs-on: ubuntu-latest
    steps:
      - name: fails but writes a summary
        run: |
          echo "### failed step summary" >> "$GITHUB_STEP_SUMMARY"
          printf 'last line without newline'
          exit 3
  dup:
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - run: mkdir -p out && echo dup > out/dup.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pkg-x64
          path: out/
  host:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: nextest
        working-directory: crate
        run: cargo nextest run --profile ci --workspace || true
      - uses: actions/upload-artifact@v4
        with:
          name: junit-cargo
          path: crate/target/nextest/ci/junit.xml
  consume:
    needs: [matrix, dup, host]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: got
      - run: find got -type f | sort; cat got/pkg-x64/*.txt
