# dsper's bana settings: .github/bana.conf in tjrb-xyz/dsper.
# Every key can also be set as BANA_<KEY> (plan.path.rust: BANA_PLAN_PATH_RUST).

repo = tjrb-xyz/dsper
# Labels dsper-linux and dsper-macos; runners named dsper-<host>-...
prefix = dsper

# Every Linux machine: what dsper's jobs need beyond bana's basics.
packages.linux = clang cmake libasound2-dev scons dbus-user-session
# The runner service keeps this PATH: cargo for the jobs.
path = ~/.cargo/bin
# Before the macOS runner registers (scons, rustup, dsper's devices), and in
# each Linux machine before its runners do (rustup).
hook.mac = bana-mac.sh
hook.linux = bana-linux.sh

# ci.yml's workflow_dispatch input `tier`: what bana ci, the daemon and the
# manager's "Start a run" run.
workflow = ci.yml
tiers = quick nightly release

# bana daemon: CI on push on the MacBook. Read at `bana daemon install`: run it
# again after changing these (bana settings shows them).
# Every branch but the bots'.
daemon.branches = * !dependabot/* !renovate/*
# No tags yet: under act, the release package matrix would build every Linux
# target at the Mac's arm64. Later: daemon.tags = v*
daemon.tags =
# Branch pushes run quick; nightly runs by hand, from the page's Run now.
daemon.tier = quick
# A newer push replaces a queued build of its branch, but lets a running one
# finish (cancelling in the middle of the CoreAudio tests leaves devices behind).
daemon.supersede = queued
# The jobs' GITHUB_TOKEN is the GitHub CLI's, as bana ci gives it.
daemon.token = gh
# Warm Linux builds, if fresh containers prove too slow (with keep-builds
# cleaning under the daemon, in scripts/ci.sh):
# act.args = --reuse

# keep-builds: what a self-hosted runner keeps between jobs.
keep = /target/ /.dsper/ node_modules/
keep_max_gb = 40

# plan: nightly and release run every job; quick runs what the change touches.
plan.everything = ^(\.github/workflows/|\.github/bana\.conf$|scripts/ci\.sh$|Cargo\.(toml|lock)$|rust-toolchain)
plan.path.rust = ^(crates/|catalog/|web/client/test/fixtures/)
plan.path.web = ^(web/|crates/)
plan.path.e2e = ^(web/|crates/dsperd/|catalog/)
plan.path.macos = ^(crates/(dsper-coreaudio|dsper-host|dsperd)/|macos/|scripts/mac\.sh$)
plan.path.mac_driver = ^macos/driver/
plan.path.streaming = ^(crates/(dsper-roc|dsper-stream)/|sdk/cpp/include/dsper/stream\.h$|sdk/cpp/examples/stream_levels\.cpp$|scripts/roc\.sh$)
plan.path.sdk = ^(sdk/|crates/dsper-stage/)
plan.path.background = ^(scripts/linux\.sh$|linux/)
plan.tier.mac_full = nightly release
plan.tier.package = nightly release
plan.tier.release = release
