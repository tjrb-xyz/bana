# The example project's .github/bana.conf: its CI machines and plan, for bana (tools/bana,
# pinned as a submodule). ci.yml beside it is its workflow, trimmed to where the jobs run.
# Every key can also be set as BANA_<KEY> (plan.path.rust: BANA_PLAN_PATH_RUST).

repo = tjrb-xyz/example
# Labels example-linux and example-macos; runners named example-<host>-...
prefix = example

# Every Linux machine: what example's jobs need beyond bana's basics. libroc's build
# (scripts/roc.sh) needs SCons, ragel, autotools (libuv, SpeexDSP) and CMake (OpenFEC).
packages.linux = clang cmake pkg-config libasound2-dev scons ragel autoconf automake libtool dbus-user-session
# The runner service keeps this PATH: cargo for the jobs.
path = ~/.cargo/bin
# Before the macOS runner registers (SCons, ragel, CMake, rustup, example's devices), and
# in each Linux machine before its runners do (rustup).
hook.mac = bana-mac.sh
hook.linux = bana-linux.sh

# ci.yml's workflow_dispatch input `tier`: what bana ci, the daemon and the manager's
# "Start a run" run.
workflow = ci.yml
tiers = quick nightly release

# bana daemon: CI on push on a Mac (docs/CI.md). Read at `bana daemon install`: run it
# again after changing these (`bana settings` shows them).
# Every branch but the bots'.
daemon.branches = * !dependabot/* !renovate/*
# A pushed v* tag builds at release (the last tier) and is a release candidate: when it
# passes with its files, bana asks whether to publish it (the page, 🧱 v0.1.0?). Under act
# the package job builds only the Mac's CPU, so a release has linux-arm64 and macos-arm64,
# and the page lists linux-x64 as not built (release.platforms, below).
daemon.tags = v*
# Branch pushes run quick; a nightly runs from the daemon's page (Run now).
daemon.tier = quick
# A newer push replaces a queued build of its branch, but lets a running one finish:
# cancelling in the middle of the CoreAudio tests can leave a mix behind.
daemon.supersede = queued
# The jobs' GITHUB_TOKEN is the GitHub CLI's, as bana ci gives it: act fetches bana's
# actions (a private repository) with it.
daemon.token = gh
# Its jobs run on bana's own labels (example-linux, example-macos), so there is no
# act.platform.* key. A label bana does not know gets one: bana init proposes it.

# keep-builds: what a self-hosted runner keeps between jobs (cargo, CamillaDSP, libroc,
# JUCE, pnpm), and target/ starts over past 40 GiB.
keep = /target/ /.example/ node_modules/
keep_max_gb = 40

# The installer bana compiles for each build and release (bana installer; sh install.sh,
# or bana install BUILD on the daemon's Mac): per-user, in ~/.local/share/example with its
# commands in ~/.local/bin. CamillaDSP stays off the PATH; example-coreaudio is in the macOS
# build only. The hook (in each archive) asks before it puts the audio devices in
# /Library/Audio/Plug-Ins/HAL with sudo, and takes them out on uninstall.
install.name = example
install.bins = exampled example-mcp example-new example-coreaudio
install.hook = install-hook.sh
install.config = ~/.config/example
install.env.EXAMPLE_LOG_DIR = ~/Library/Logs/example
# A release carries the package job's archives and .debs; the rest stays on the daemon's page.
release.files = example-*.tar.gz example-*.deb
# The platforms ci.yml packages: the release's page lists those with no archive.
release.platforms = linux-arm64 linux-x64 macos-arm64

# The CI report's standards (bana report, and each daemon build's report.md), in this
# order, then all: jobs, JOB/STEP, or test:NAME, as globs. A check may count in several.
report.toolchain = */dtolnay/rust-toolchain* */pnpm/action-setup*
report.rust = rust
# The engine's facts against a real CamillaDSP, wherever cargo ran them.
report.engine = test:real_*
report.web = web e2e
report.macos = macos mac_driver mac_full
report.streaming = streaming
report.sdk = sdk
report.linux_service = background*
report.packaging = package release
# ::notice:: text that says a step checked nothing here: not run here, never a pass.
report.left_out = "*left out*" "*Not a dedicated CI Mac*"

# plan: nightly and release run every job; quick runs what the change touches.
plan.everything = ^(\.github/workflows/|\.github/bana\.conf$|scripts/ci\.sh$|scripts/camilladsp\.sh$|tools/bana$|Cargo\.(toml|lock)$|rust-toolchain)
plan.path.rust = ^(crates/|catalog/|web/client/test/fixtures/)
plan.path.web = ^(web/|crates/)
plan.path.e2e = ^(web/|crates/exampled/|catalog/)
plan.path.macos = ^(crates/(example-coreaudio|example-host|exampled)/|macos/|scripts/mac\.sh$)
plan.path.mac_driver = ^macos/driver/
plan.path.streaming = ^(crates/(example-roc|example-stream)/|sdk/cpp/include/example/stream\.h$|sdk/cpp/examples/stream_levels\.cpp$|scripts/roc\.sh$)
plan.path.sdk = ^(sdk/|crates/example-stage/)
plan.path.background = ^(scripts/linux\.sh$|linux/)
plan.tier.mac_full = nightly release
plan.tier.package = nightly release
plan.tier.release = release
